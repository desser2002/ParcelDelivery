spring.application.name=ParcelDelivery
# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/parcel_delivery
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

#HashId
tracking.hashids.salt=uX9$mK2@pL5#nQ8
tracking.hashids.min-length=10

#System var
packing.scheduler.interval-ms=15000
packing.scheduler.initial-delay-ms=15000
packing.vehicle.fill-threshold=0.8

#Logging
logging.level.org.dzianisbova.parceldelivery=INFO
logging.level.org.dzianisbova.parceldelivery.dispatch=DEBUG

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=load-generator-group
spring.kafka.consumer.auto-offset-reset=latest